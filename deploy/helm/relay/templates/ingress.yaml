{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: relay
  labels:
    {{- include "relay.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: relay-api
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: relay-web
                port:
                  number: 80
{{- end }}
