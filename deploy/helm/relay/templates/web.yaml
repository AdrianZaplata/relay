apiVersion: apps/v1
kind: Deployment
metadata:
  name: relay-web
  labels:
    {{- include "relay.labels" . | nindent 4 }}
    app.kubernetes.io/name: relay-web
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: relay-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: relay-web
        app.kubernetes.io/component: web
    spec:
      containers:
        - name: web
          image: {{ include "relay.image" (dict "component" "relay-web" "Values" .Values) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: relay-web
  labels:
    {{- include "relay.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: relay-web
  ports:
    - port: 80
      targetPort: 80
