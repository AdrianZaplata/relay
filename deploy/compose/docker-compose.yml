name: relay

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: relay
      POSTGRES_DB: relay
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relay -d relay"]
      interval: 3s
      timeout: 3s
      retries: 15

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.7
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --default-log-level=warn
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
    ports:
      - "19092:19092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot: create the telemetry topic with 3 partitions (keyed by asset_id).
  redpanda-init:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.7
    entrypoint: ["/bin/sh", "-c"]
    command:
      - rpk topic create telemetry --partitions 3 --replicas 1 --brokers redpanda:9092 || true
    depends_on:
      redpanda:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ../../apps/relay
    image: relay-service:latest
    environment:
      RELAY_DATABASE_URL: postgresql+asyncpg://relay:relay@postgres:5432/relay
      RELAY_KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      RELAY_LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Primary telemetry ingestion: same image as the API, different command.
  ingestor:
    build:
      context: ../../apps/relay
    image: relay-service:latest
    command: ["python", "-m", "relay.ingestor"]
    environment:
      RELAY_DATABASE_URL: postgresql+asyncpg://relay:relay@postgres:5432/relay
      RELAY_KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      RELAY_TELEMETRY_TOPIC: telemetry
      RELAY_CONSUMER_GROUP: relay-ingestor
      RELAY_LOG_LEVEL: INFO
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully
    restart: unless-stopped

  simulator:
    build:
      context: ../../apps/simulator
    environment:
      RELAY_API_BASE: http://api:8000
      RELAY_KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      RELAY_TELEMETRY_TOPIC: telemetry
      RELAY_SIM_INTERVAL: "2.0"
    depends_on:
      redpanda:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully
      api:
        condition: service_started
    restart: unless-stopped

  web:
    build:
      context: ../../apps/web
      args:
        VITE_API_BASE: http://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  pgdata:
